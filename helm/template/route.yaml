apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  to:
    kind: Service
    name: {{ .Values.name }}
    targetPort: http
  tls:
    termination: {{ .Values.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: {{ .Values.wildcardPolicy }}

  